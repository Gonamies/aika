<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Dynaaminen vuosikalenteri v1.3.2</title>
    <style>
        /* Perusasetukset ruudulle */
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 10px;
        }

        .versionumero {
            text-align: right;
            font-size: 11px;
            color: #666;
            margin-right: 15px;
            margin-bottom: 5px;
        }

        .kalenteri-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            margin: 0 auto;
            /* Skaalaa kalenteria suuremmaksi ruudulla siististi vasemmasta reunasta */
            zoom: 1.35;
        }

        .vuosi-box {
            flex: 1;
            border-right: 1px solid #ccc;
            padding-right: 8px;
        }
        .vuosi-box:last-child {
            border-right: none;
            padding-right: 0;
        }
        .vuosi-otsikko {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .kuukaudet-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .kuukausi {
            font-size: 9px;
            margin-bottom: 6px;
        }
        .kuukausi-nimi {
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 2px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            padding: 1px 0;
            font-size: 9px;
        }
        th {
            font-weight: bold;
            font-size: 8.5px;
        }
        
        /* Viikkonumeroiden otsikko (Vk) ja solut vasemmalle */
        th:first-child, td:first-child {
            text-align: left !important;
			font-weight: bold;
            padding-left: 3px;
			width: 11px;
        }

        .pyha {
            color: red;
        }
        .erityispaiva {
            color: blue;
        }
        .projekti-paiva {
            background-color: #f5964e !important;
        }
        .kuluva-paiva {
            background-color: #00B050 !important;
            font-weight: bold;
        }
        .muu-kuu {
            color: #aaa;
        }
        .pyha-lista {
            margin-top: 10px;
            font-size: 7.5px;
            line-height: 1.5;
            color: #333;
            min-height: 24px;
            margin-left: 3px;
            text-align: left;
        }

        /* TULOSTUSASETUKSET */
        @media print {
            @page {
                size: A4 landscape;
                margin: 8mm;
            }
            body {
                padding: 5px;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;				
            }
            .kalenteri-container {
                zoom: 1 !important;
                width: 100% !important;
            }
            .muu-kuu {
                color: #aaa !important;
            }
            .kuluva-paiva {
                background-color: #00B050 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .projekti-paiva {
                background-color: #f5964e !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .erityispaiva {
                color: blue !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

<div class="versionumero">Versio 1.3.2</div>
<div class="kalenteri-container" id="kalenteriContainer">
    <!-- Kalenteri generoituu dynaamisesti JavaScriptillä -->
</div>

<script>
    const projektit = [
        { nimi: "337 Pilkko", alku: new Date(2026, 9, 6), loppu: new Date(2026, 9, 17) },
        { nimi: "338 Oulu", alku: new Date(2026, 9, 20), loppu: new Date(2026, 9, 31) },
        { nimi: "339 Höylä", alku: new Date(2026, 10, 10), loppu: new Date(2026, 10, 21) },
        { nimi: "313 Helsinki", alku: new Date(2026, 10, 24), loppu: new Date(2026, 11, 5) }
    ];

    const kuukaudetNimet = [
        "Tammikuu", "Helmikuu", "Maaliskuu", "Huhtikuu", "Toukokuu", "Kesäkuu",
        "Heinäkuu", "Elokuu", "Syyskuu", "Lokakuu", "Marraskuu", "Joulukuu"
    ];

    const viikonPaivat = ["Vk", "MA", "TI", "KE", "TO", "PE", "LA", "SU"];
    const pvLyhenteet = ["su", "ma", "ti", "ke", "to", "pe", "la"];
    const pvNimetIso = ["Su", "Ma", "Ti", "Ke", "To", "Pe", "La"];

    function haePaasiainen(vuosi) {
        const a = vuosi % 19;
        const b = Math.floor(vuosi / 100);
        const c = vuosi % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        const f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4);
        const k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * l) / 451);
        const kuukausi = Math.floor((h + l - 7 * m + 114) / 31) - 1;
        const paiva = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(vuosi, kuukausi, paiva);
    }

    function haeViikkoNumero(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
        var vuosiAlku = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        var viikkoNro = Math.ceil((((d - vuosiAlku) / 86400000) + 1) / 7);
        return viikkoNro;
    }

    function haeViimeinenSunnuntai(vuosi, kk) {
        let d = new Date(vuosi, kk + 1, 0);
        let p = d.getDate();
        while (p > 0) {
            let testD = new Date(vuosi, kk, p);
            if (testD.getDay() === 0) {
                return p;
            }
            p--;
        }
        return null;
    }

    function haeErityispaivanNimi(pvm) {
        const v = pvm.getFullYear();
        const kk = pvm.getMonth();
        const p = pvm.getDate();

        if (kk === 2) {
            const viimSunnuntai = haeViimeinenSunnuntai(v, 2);
            if (p === viimSunnuntai) return "Kesäaikaan siirtyminen";
        }

        if (kk === 9) {
            const viimSunnuntai = haeViimeinenSunnuntai(v, 9);
            if (p === viimSunnuntai) return "Normaaliaikaan siirtyminen";
        }

        return null;
    }

    function haePyhanNimi(pvm) {
        const v = pvm.getFullYear();
        const kk = pvm.getMonth(); 
        const p = pvm.getDate();
        const pv = pvm.getDay(); 

        if (kk === 0 && p === 1) return "Uudenvuodenpäivä";
        if (kk === 0 && p === 6) return "Loppiainen";
        if (kk === 4 && p === 1) return "Vappu";
        if (kk === 11 && p === 6) return "Itsenäisyyspäivä";
        if (kk === 11 && p === 25) return "Joulupäivä";
        if (kk === 11 && p === 26) return "Tapaninpäivä";

        const paasiainen = haePaasiainen(v);
        
        const pitkaPerjantai = new Date(paasiainen);
        pitkaPerjantai.setDate(paasiainen.getDate() - 2);
        if (kk === pitkaPerjantai.getMonth() && p === pitkaPerjantai.getDate()) return "Pitkäperjantai";

        if (kk === paasiainen.getMonth() && p === paasiainen.getDate()) return "Pääsiäispäivä";

        const paasiainenMaanantai = new Date(paasiainen);
        paasiainenMaanantai.setDate(paasiainen.getDate() + 1);
        if (kk === paasiainenMaanantai.getMonth() && p === paasiainenMaanantai.getDate()) return "Pääsiäismaanantai";

        const helatorstai = new Date(paasiainen);
        helatorstai.setDate(paasiainen.getDate() + 39);
        if (kk === helatorstai.getMonth() && p === helatorstai.getDate()) return "Helatorstai";

        if (kk === 5 && p >= 19 && p <= 25 && pv === 5) return "Juhannusaatto";
        if (kk === 5 && p >= 20 && p <= 26 && pv === 6) return "Juhannuspäivä";
        
        if ((kk === 9 && p === 31 && pv === 6) || (kk === 10 && p >= 1 && p <= 6 && pv === 6)) {
            return "Pyhäinpäivä";
        }

        return null;
    }

    function onkoPyha(pvm) {
        if (pvm.getDay() === 0) return true;
        return haePyhanNimi(pvm) !== null;
    }

    function haeAktiivinenProjekti(pvm) {
        const tTime = new Date(pvm.getFullYear(), pvm.getMonth(), pvm.getDate()).getTime();
        for (let proj of projektit) {
            const alkuTime = new Date(proj.alku.getFullYear(), proj.alku.getMonth(), proj.alku.getDate()).getTime();
            const loppuTime = new Date(proj.loppu.getFullYear(), proj.loppu.getMonth(), proj.loppu.getDate()).getTime();
            if (tTime >= alkuTime && tTime <= loppuTime) {
                return proj.nimi;
            }
        }
        return null;
    }

    function muotoilePvmLyhyt(d) {
        const pvNimi = pvNimetIso[d.getDay()];
        const p = String(d.getDate()).padStart(1, ' ');
        const kk = d.getMonth() + 1;
        const v = String(d.getFullYear()).slice(-2);
        return `${pvNimi} ${p}.${kk}.${v}`;
    }

    function luoKuuTaulukkoJaPyhat(vuosi, kkIndex) {
        const ekaPaiva = new Date(vuosi, kkIndex, 1);
        const vikaPaiva = new Date(vuosi, kkIndex + 1, 0);
        
        let aloitusPaiva = ekaPaiva.getDay() - 1;
        if (aloitusPaiva === -1) aloitusPaiva = 6;

        let html = `<table><tr>`;
        viikonPaivat.forEach(pv => {
            html += `<th>${pv}</th>`;
        });
        html += `</tr>`;

        let paivaLaskuri = 1;
        let edellisenVika = new Date(vuosi, kkIndex, 0).getDate();
        
        let punaisetRivit = [];
        let sinisetRivit = [];
        let projektitRivit = [];
        
        for (let i = 0; i < 6; i++) {
            if (paivaLaskuri > vikaPaiva.getDate() && i > 0) break;

            let viikkoPvm;
            if (i === 0) {
                viikkoPvm = new Date(vuosi, kkIndex, 1);
            } else {
                viikkoPvm = new Date(vuosi, kkIndex, paivaLaskuri);
            }
            let viikkoNro = haeViikkoNumero(viikkoPvm);
            let viikkoNroStr = String(viikkoNro).padStart(2, '0');

            html += `<tr>`;
            html += `<td style="font-size: 9px;">${viikkoNro}</td>`;

            for (let j = 0; j < 7; j++) {
                let solunTeksti = "";
                let luokat = [];
                let pvmObj;

                if (i === 0 && j < aloitusPaiva) {
                    let pvn = edellisenVika - (aloitusPaiva - 1 - j);
                    solunTeksti = pvn;
                    luokat.push("muu-kuu");
                } else if (paivaLaskuri <= vikaPaiva.getDate()) {
                    pvmObj = new Date(vuosi, kkIndex, paivaLaskuri);
                    solunTeksti = paivaLaskuri;
                    
                    let pyhanNimi = haePyhanNimi(pvmObj);
                    let erityisNimi = haeErityispaivanNimi(pvmObj);
                    let projektiNimi = haeAktiivinenProjekti(pvmObj);

                    let pvStr = pvLyhenteet[pvmObj.getDay()];
                    let pvaStr = String(pvmObj.getDate()).padStart(2, '0');

                    // Lisätään listaan vain varsinaiset erikoispyhät (ei tavallisia sunnuntaita)
                    if (pyhanNimi !== null) {
                        punaisetRivit.push(`<span style="color: red;">${viikkoNroStr} - ${pvStr} ${pvaStr} - ${pyhanNimi}</span>`);
                    }

                    if (erityisNimi !== null) {
                        sinisetRivit.push(`<span style="color: blue;">${viikkoNroStr} - ${pvStr} ${pvaStr} - ${erityisNimi}</span>`);
                    }

                    if (projektiNimi !== null) {
                        for (let proj of projektit) {
                            if (proj.nimi === projektiNimi && 
                                pvmObj.getFullYear() === proj.alku.getFullYear() &&
                                pvmObj.getMonth() === proj.alku.getMonth() &&
                                pvmObj.getDate() === proj.alku.getDate()) {
                                let alkuMuoto = muotoilePvmLyhyt(proj.alku);
                                let loppuMuoto = muotoilePvmLyhyt(proj.loppu);
                                // Muutettu projektin tekstin väri vastaamaan kalenterissa käytettyä projektiväriä (#f5964e)
                                projektitRivit.push(`<span style="color: #f07416;">${viikkoNroStr} - ${alkuMuoto} - ${proj.nimi}</span>`);
                            }
                        }
                        luokat.push("projekti-paiva");
                    }

                    if (erityisNimi !== null) {
                        luokat.push("erityispaiva");
                    } else if (onkoPyha(pvmObj)) {
                        luokat.push("pyha");
                    }

                    const nyt = new Date();
                    if (pvmObj.getFullYear() === nyt.getFullYear() && 
                        pvmObj.getMonth() === nyt.getMonth() && 
                        pvmObj.getDate() === nyt.getDate()) {
                        luokat = luokat.filter(l => l !== "projekti-paiva" && l !== "pyha");
                        luokat.push("kuluva-paiva");
                    }

                    paivaLaskuri++;
                } else {
                    let pvn = paivaLaskuri - vikaPaiva.getDate();
                    solunTeksti = pvn;
                    luokat.push("muu-kuu");
                    paivaLaskuri++;
                }

                html += `<td class="${luokat.join(' ')}">${solunTeksti}</td>`;
            }
            html += `</tr>`;
        }
        html += `</table>`;

        let kaikkiRivit = [...punaisetRivit, ...sinisetRivit, ...projektitRivit];

        let pyhaHtml = `<div class="pyha-lista">`;
        if (kaikkiRivit.length > 0) {
            pyhaHtml += kaikkiRivit.join("<br>");
        }
        pyhaHtml += `</div>`;

        return { taulukko: html, pyhat: pyhaHtml };
    }

    function renderöiKalenteri() {
        const kuluvaVuosi = new Date().getFullYear();
        const vuodet = [kuluvaVuosi - 1, kuluvaVuosi, kuluvaVuosi + 1];
        const container = document.getElementById("kalenteriContainer");
        
        let htmlContent = "";

        vuodet.forEach(vuosi => {
            htmlContent += `<div class="vuosi-box">`;
            htmlContent += `<div class="vuosi-otsikko">${vuosi}</div>`;
            htmlContent += `<div class="kuukaudet-grid">`;

            for (let kk = 0; kk < 12; kk++) {
                let tulos = luoKuuTaulukkoJaPyhat(vuosi, kk);
                htmlContent += `<div class="kuukausi">`;
                htmlContent += `<div class="kuukausi-nimi">${kuukaudetNimet[kk]}</div>`;
                htmlContent += tulos.taulukko;
                htmlContent += tulos.pyhat;
                htmlContent += `</div>`;
            }

            htmlContent += `</div></div>`;
        });

        container.innerHTML = htmlContent;
    }

    renderöiKalenteri();
</script>

</body>
</html>
