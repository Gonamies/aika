<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Päiväystiedot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            margin: 0;
            padding: 15px;
        }
        .sivu-kontti {
            display: flex;
            gap: 25px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .laatikko {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            width: 300px;
            box-sizing: border-box;
        }
        .rivi {
            margin-bottom: 12px;
            font-size: 14px;
        }
        .viikonpaiva {
            font-weight: bold;
            color: #0078d4;
        }
        .kellonaika {
            font-size: 24px;
            font-weight: bold;
            color: #201f1e;
            display: block;
            margin-top: 5px;
        }
        .progress {
            background-color: #edebe9;
            border-radius: 4px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-bar {
            background-color: #0078d4;
            height: 100%;
            width: 0%;
        }
        .progress-label {
            font-size: 12px;
            color: #605e5c;
            display: block;
            margin-top: 4px;
            text-align: right;
        }
        .tieto-lohko {
            margin-bottom: 20px;
        }
        .tieto-lohko:last-child {
            margin-bottom: 0;
        }
        .tieto-otsikko {
            font-size: 15px;
            font-weight: bold;
            color: #201f1e;
            margin-bottom: 6px;
        }
        .tieto-teksti {
            font-size: 13px;
            color: #323130;
            line-height: 1.4;
        }
        .tieto-teksti a {
            color: #0078d4;
            text-decoration: none;
        }
        .tieto-teksti a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="sivu-kontti">
    <!-- Vasen puoli: Päivämäärä- ja kellonaikaosio -->
    <div class="laatikko">
        <div class="rivi">
            <span class="viikonpaiva" id="viikonpaiva"></span> | 
            <span class="paivamaara" id="paivamaara"></span>
        </div>
        
        <div class="rivi">
            <span class="viikkonumero" id="viikkonumero"></span>
        </div>

        <div class="rivi">
            Kello:
            <span class="kellonaika" id="kellonaika">00:00:00</span>
        </div>

        <div class="rivi" style="margin-bottom: 0;">
            Vuodesta kulunut:
            <div class="progress">
                <div class="progress-bar" id="vuosi-bar"></div>
            </div>
            <span class="progress-label" id="vuosi-label">0 %</span>
        </div>
    </div>

    <!-- Oikea puoli: Nimipäivät sekä Auringon tiedot -->
    <div class="laatikko">
        <div class="tieto-lohko">
            <div class="tieto-otsikko">Suomalaiset nimipäivät</div>
            <div class="tieto-teksti" id="nimipaivat-teksti">Ladataan...</div>
        </div>

        <div class="tieto-lohko">
            <div class="tieto-otsikko">Auringon tiedot</div>
            <div class="tieto-teksti" id="auringon-tiedot">
                <div>☀️ Auringon nousu: <b id="aurinko-nousu">--:--</b></div>
                <div>🌇 Auringon lasku: <b id="aurinko-lasku">--:--</b></div>
            </div>
        </div>
    </div>
</div>

<script>
    const nimipaivatKanta = {
        "18-9": ["Telle", "Lasse"],
        "19-9": ["Reija", "Veija"],
        "20-9": ["Teto", "Pamela"]
    };

    const lahtiKoordinaatit = { lat: 60.9827, lon: 25.6615 };

    function paivitaKaikki() {
        const nyt = new Date();

        const viikonpaivat = ['Sunnuntai', 'Maanantai', 'Tiistai', 'Keskiviikko', 'Torstai', 'Perjantai', 'Lauantai'];
        document.getElementById('viikonpaiva').innerText = viikonpaivat[nyt.getDay()];
        
        const paivaAsetukset = { day: 'numeric', month: 'numeric', year: 'numeric' };
        document.getElementById('paivamaara').innerText = nyt.toLocaleDateString('fi-FI', paivaAsetukset);

        const alkuVuosi = new Date(nyt.getFullYear(), 0, 1);
        const viikkoNro = Math.ceil((((nyt - alkuVuosi) / 86400000) + alkuVuosi.getDay() + 1) / 7);
        document.getElementById('viikkonumero').innerText = `Viikkonumero ${viikkoNro}.`;

        document.getElementById('kellonaika').innerText = nyt.toLocaleTimeString('fi-FI');

        const vuosi = nyt.getFullYear();
        const alkaa = new Date(vuosi, 0, 1);
        const paattyy = new Date(vuosi + 1, 0, 1);
        const kulunutAika = nyt - alkaa;
        const kokoVuosi = paattyy - alkaa;
        const prosentti = (kulunutAika / kokoVuosi) * 100;

        document.getElementById('vuosi-bar').style.width = prosentti.toFixed(2) + '%';
        document.getElementById('vuosi-label').innerText = prosentti.toFixed(2) + ' %';

        const avainPvm = `${nyt.getDate()}-${nyt.getMonth() + 1}`;
        const nimariElementti = document.getElementById('nimipaivat-teksti');
        const nimiluettelo = nimipaivatKanta[avainPvm];

        if (nimiluettelo && nimiluettelo.length > 0) {
            let linkkiHtml = nimiluettelo.map(nimi => 
                `<a href="https://info.paivyri.fi/nimihaku/?fname=${encodeURIComponent(nimi)}&country=fi" target="_blank">${nimi}</a>`
            ).join(' ja ');
            nimariElementti.innerHTML = linkkiHtml;
        } else {
            nimariElementti.innerText = "Ei nimipäivätietoa tälle päivälle.";
        }
    }

    function LaskeAurinko(lat, lon) {
        return { nousu: "06:50", lasku: "19:40" };
    }

    function paivitaAurinko() {
        const ajat = LaskeAurinko(lahtiKoordinaatit.lat, lahtiKoordinaatit.lon);
        document.getElementById('aurinko-nousu').innerText = ajat.nousu;
        document.getElementById('aurinko-lasku').innerText = ajat.lasku;
    }

    paivitaKaikki();
    paivitaAurinko();
    setInterval(paivitaKaikki, 1000);
</script>

</body>
</html>
